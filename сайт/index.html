<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Тнграм — приватный мессенджер</title>
  <meta name="description" content="Тнграм — приватный мессенджер. Сообщение доставлено и сразу удалено с сервера. Переписка хранится только на твоём устройстве."/>
  <meta name="theme-color" content="#05070a"/>

  <!-- Иконка сайта (favicon). Файл icon.png лежит рядом с index.html -->
  <link rel="icon" href="icon.png" type="image/png" id="favicon"/>
  <link rel="apple-touch-icon" href="icon.png"/>

  <!-- Превью при отправке ссылки в мессенджерах -->
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Тнграм — приватный мессенджер" id="og-title"/>
  <meta property="og:description" content="Приватный мессенджер без хранения переписки на сервере. Уже можно скачать." id="og-desc"/>
  <meta property="og:image" content="icon.png"/>

  <style>
    /* ============================================================================
       1. ЦВЕТА И НАСТРОЙКИ — меняй оформление здесь
       ----------------------------------------------------------------------------
       --a1 / --a2  — основные акценты (записываются как "47,123,255" без rgb())
       --a1-soft / --a2-soft — те же цвета, но светлее: для текста и градиентов
       Темы ниже можно менять и дополнять: [data-theme="имя"].
       ============================================================================ */
    :root{
      --bg:            #05070a;                  /* основной тёмный фон */
      --text:          #f4f7fb;                  /* основной текст */
      --muted:         #99a3b2;                  /* вторичный текст */
      --line:          rgba(255,255,255,.10);    /* тонкая светлая обводка */
      --glass:         rgba(255,255,255,.055);   /* стеклянная подложка */
      --radius:        26px;                     /* скругление карточек */
      --blur:          22px;                     /* сила размытия стекла */
      --maxw:          1080px;                   /* ширина контента */
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
              Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Тема 1 — «Тёмная» (по умолчанию): синий + зелёный */
    :root, :root[data-theme="dark"]{
      --a1: 47,123,255;      --a2: 0,224,143;      --a3: 122,92,255;
      --a1-soft: #a9c8ff;    --a2-soft: #7ff0c4;
    }
    /* Тема 2 — «Зелёная» */
    :root[data-theme="green"]{
      --a1: 0,196,132;       --a2: 138,214,42;     --a3: 0,166,196;
      --a1-soft: #96f0cd;    --a2-soft: #c6f07a;
    }
    /* Тема 3 — «Синяя» */
    :root[data-theme="blue"]{
      --a1: 59,130,246;      --a2: 139,92,246;     --a3: 56,189,248;
      --a1-soft: #b6c9ff;    --a2-soft: #cbb4ff;
    }

    /* Градиентный текст (заголовки-акценты) */
    .gradient-text{
      background: linear-gradient(100deg, #ffffff 0%, var(--a1-soft) 48%, var(--a2-soft) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }

    /* ============================================================================
       2. БАЗА
       ============================================================================ */
    *,*::before,*::after{ box-sizing: border-box; }
    html{ scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body{
      margin: 0; font-family: var(--font); color: var(--text); background: var(--bg);
      line-height: 1.6; overflow-x: hidden;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    img{ max-width: 100%; display: block; }
    ::selection{ background: rgba(var(--a1), .4); }
    .wrap{ width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: 22px; }

    /* Плавная смена цветов при переключении темы */
    body, .bg, .card, .panel, .badge, .card-icon, .chip, .step, .phone, .btn-ghost, .lang{
      transition: background-color .6s ease, border-color .6s ease, box-shadow .6s ease, color .6s ease;
    }

    /* ============================================================================
       3. ФОН: плавающие размытые цветные пятна
       ============================================================================ */
    .bg{
      position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
      background:
        radial-gradient(1100px 700px at 12% -12%, rgba(var(--a1),.20), transparent 62%),
        radial-gradient(900px 650px at 92% 4%,   rgba(var(--a2),.15), transparent 62%),
        radial-gradient(900px 900px at 50% 120%, rgba(var(--a3),.13), transparent 65%);
    }
    .blob{ position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; animation: drift 22s ease-in-out infinite alternate; }
    .blob-1{ width: 46vw; height: 46vw; left: -6vw; top: -8vh;  background: radial-gradient(circle, rgba(var(--a1),.85), transparent 68%); }
    .blob-2{ width: 38vw; height: 38vw; right: -4vw; top: 18vh; background: radial-gradient(circle, rgba(var(--a2),.70), transparent 68%); animation-delay: -6s; }
    .blob-3{ width: 34vw; height: 34vw; left: 28vw; bottom: -6vh; background: radial-gradient(circle, rgba(var(--a3),.55), transparent 70%); animation-delay: -12s; }
    @keyframes drift{
      from{ transform: translate3d(0,0,0) scale(1); }
      to  { transform: translate3d(5vw,-5vh,0) scale(1.18); }
    }

    /* ============================================================================
       4. ШАПКА
       ============================================================================ */
    .site-header{
      position: sticky; top: 0; z-index: 50;
      background: rgba(5,7,10,.62);
      -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
      border-bottom: 1px solid var(--line);
    }
    .header-inner{ min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand{ display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .brand img{ width: 34px; height: 34px; border-radius: 10px; box-shadow: 0 8px 22px rgba(var(--a1),.35), 0 0 0 1px rgba(255,255,255,.10) inset; }
    .brand span{ font-size: 17px; font-weight: 600; letter-spacing: -.01em; }

    /* Переключатель языка RU / EN */
    .lang{
      display: flex; align-items: center; gap: 2px; padding: 3px;
      border: 1px solid var(--line); border-radius: 999px; background: var(--glass);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    }
    .lang button{
      font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .02em;
      color: var(--muted); background: none; border: 0; cursor: pointer;
      padding: 6px 13px; border-radius: 999px;
      transition: color .25s, background .35s, box-shadow .35s;
    }
    .lang button:hover{ color: var(--text); }
    .lang button[aria-pressed="true"]{
      color: #fff; background: linear-gradient(120deg, rgba(var(--a1),.85), rgba(var(--a2),.75));
      box-shadow: 0 6px 18px rgba(var(--a1),.35);
    }

    /* ============================================================================
       4.5. ПРИВЕТСТВЕННОЕ ОКНО С ПРИГЛАШЕНИЕМ ПРОЙТИ ТЕСТ
       ============================================================================ */
    .welcome{
      position: fixed; left: 0; right: 0; top: 84px; z-index: 55;
      display: flex; justify-content: center; padding-inline: 16px;
      pointer-events: none;
    }
    .welcome-inner{
      pointer-events: auto; display: flex; align-items: center; gap: 12px;
      width: 100%; max-width: 560px; padding: 12px 14px 12px 16px;
      border-radius: 20px; background: rgba(12,17,24,.92);
      border: 1px solid rgba(var(--a2),.34);
      box-shadow: 0 22px 50px rgba(0,0,0,.55), 0 0 34px rgba(var(--a2),.14);
      -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
      opacity: 0; transform: translateY(-16px);
      transition: opacity .45s cubic-bezier(.22,1,.36,1), transform .45s cubic-bezier(.22,1,.36,1);
    }
    .welcome.show .welcome-inner{ opacity: 1; transform: none; }
    .welcome-icon{
      width: 34px; height: 34px; flex: none; display: grid; place-items: center;
      border-radius: 11px; color: #04121b; font-weight: 800; font-size: 17px;
      background: linear-gradient(135deg, rgb(var(--a1)), rgb(var(--a2)));
    }
    .welcome-text{ flex: 1; min-width: 0; display: grid; line-height: 1.35; }
    .welcome-text b{ font-size: 14.5px; font-weight: 700; }
    .welcome-text span{ font-size: 13px; color: var(--muted); }
    .welcome-cta{
      flex: none; cursor: pointer; font: inherit; font-size: 13.5px; font-weight: 700;
      padding: 9px 16px; border-radius: 999px; border: 0; color: #04121b;
      background: linear-gradient(120deg, rgb(var(--a1)), rgb(var(--a2)));
      box-shadow: 0 10px 24px rgba(var(--a1),.32);
      transition: transform .3s, box-shadow .3s;
    }
    .welcome-cta:hover{ transform: translateY(-1px); box-shadow: 0 14px 28px rgba(var(--a1),.42); }
    .welcome-close{
      flex: none; width: 28px; height: 28px; display: grid; place-items: center; cursor: pointer;
      font: inherit; font-size: 18px; line-height: 1; color: var(--muted);
      background: none; border: 0; border-radius: 50%;
      transition: color .25s, background .25s;
    }
    .welcome-close:hover{ color: var(--text); background: rgba(255,255,255,.08); }
    @media (max-width: 620px){
      .welcome{ top: 76px; }
      .welcome-inner{ flex-wrap: wrap; padding: 12px; }
      .welcome-text{ flex: 1 1 100%; order: 2; }
      .welcome-cta{ order: 1; flex: 1 1 auto; }
      .welcome-close{ order: 0; margin-left: auto; }
    }

    /* ============================================================================
       5. ГЛАВНЫЙ ЭКРАН
       ============================================================================ */
    .hero{ min-height: 88vh; display: grid; place-items: center; text-align: center; padding: 84px 0 64px; }
    .hero-logo{
      width: 116px; height: 116px; margin: 0 auto 30px; border-radius: 28px;
      animation: float 7s ease-in-out infinite;
      box-shadow: 0 0 0 1px rgba(255,255,255,.10), 0 26px 70px rgba(var(--a1),.30);
    }
    @keyframes float{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-12px); } }
    .hero h1{ margin: 0 0 18px; font-weight: 700; letter-spacing: -.035em; line-height: 1.02; font-size: clamp(52px, 10vw, 96px); }
    .hero .slogan{ margin: 0 auto; max-width: 640px; color: var(--muted); font-size: clamp(17px, 2.3vw, 21px); line-height: 1.55; }
    .hero .sub{ margin: 14px auto 0; max-width: 560px; color: rgba(153,163,178,.75); font-size: clamp(14px, 1.7vw, 16px); }

    /* Плашка «Скоро» */
    .badge{
      display: inline-flex; align-items: center; gap: 9px; margin-top: 34px;
      padding: 9px 18px; border-radius: 999px;
      font-size: 14px; font-weight: 600; letter-spacing: .04em; color: #dff7ec;
      background: linear-gradient(120deg, rgba(var(--a1),.22), rgba(var(--a2),.20));
      border: 1px solid rgba(255,255,255,.16);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      box-shadow: 0 12px 34px rgba(0,0,0,.35), 0 0 34px rgba(var(--a2),.14);
    }
    .badge .dot{ width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--a2)); animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse{
      0%{ box-shadow: 0 0 0 0 rgba(var(--a2),.55); }
      70%{ box-shadow: 0 0 0 12px rgba(var(--a2),0); }
      100%{ box-shadow: 0 0 0 0 rgba(var(--a2),0); }
    }

    /* Кнопки под плашкой: «Скачать» и «Как это работает» */
    .hero-cta{ display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 26px; }
    .hero-cta .btn-primary, .hero-cta .btn-ghost{ text-decoration: none; }

    /* ============================================================================
       6. ОБЩЕЕ ДЛЯ СЕКЦИЙ
       ============================================================================ */
    section{ padding: 76px 0; scroll-margin-top: 86px; }
    .eyebrow{ margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h2{ margin: 0 0 20px; font-weight: 700; letter-spacing: -.025em; line-height: 1.12; font-size: clamp(30px, 4.6vw, 46px); }
    h3{ margin: 0 0 8px; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
    .lead{ margin: 0; max-width: 760px; color: var(--muted); font-size: clamp(16px, 2vw, 19px); }
    .lead + .lead{ margin-top: 16px; }
    .note{ margin: 16px 0 0; color: rgba(153,163,178,.8); font-size: 15px; }

    /* Стеклянная панель (универсальная) */
    .panel{
      border-radius: var(--radius); background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%);
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }

    /* Кнопки */
    .btn-primary{
      padding: 14px 26px; border-radius: 999px; border: 0; cursor: pointer;
      font: inherit; font-weight: 600; color: #04121b;
      background: linear-gradient(120deg, rgb(var(--a1)), rgb(var(--a2)));
      box-shadow: 0 14px 34px rgba(var(--a1),.32);
      transition: transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s;
    }
    .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 20px 44px rgba(var(--a1),.42); }
    .btn-ghost{
      display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
      padding: 13px 22px; border-radius: 999px; font-weight: 600; font-size: 15px;
      color: var(--text); background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      transition: transform .35s cubic-bezier(.22,1,.36,1), border-color .35s, box-shadow .35s;
    }
    .btn-ghost:hover{ transform: translateY(-2px); border-color: rgba(var(--a2),.45); box-shadow: 0 16px 38px rgba(0,0,0,.4); }
    .btn-ghost svg{ width: 18px; height: 18px; }

    /* Появление при скролле */
    .reveal{ opacity: 0; transform: translateY(26px); transition: opacity .9s cubic-bezier(.22,1,.36,1), transform .9s cubic-bezier(.22,1,.36,1); transition-delay: var(--d, 0ms); }
    .reveal.in{ opacity: 1; transform: none; }
    /* ============================================================================
       7. СТЕКЛЯННЫЕ КАРТОЧКИ ВОЗМОЖНОСТЕЙ
       ============================================================================ */
    .cards{ display: grid; gap: 18px; margin-top: 42px; grid-template-columns: repeat(auto-fit, minmax(272px, 1fr)); }
    .card{
      position: relative; overflow: hidden; padding: 26px 24px 28px;
      border-radius: var(--radius); background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%);
      transition: transform .5s cubic-bezier(.22,1,.36,1), border-color .4s, box-shadow .5s;
    }
    .card::after{
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .45s;
      background: radial-gradient(420px 240px at var(--mx,50%) var(--my,0%), rgba(var(--a1),.16), transparent 70%);
    }
    .card:hover{ transform: translateY(-6px); border-color: rgba(255,255,255,.20); box-shadow: 0 26px 60px rgba(0,0,0,.45), 0 0 46px rgba(var(--a2),.10); }
    .card:hover::after{ opacity: 1; }
    .card-icon{
      width: 46px; height: 46px; display: grid; place-items: center; margin-bottom: 18px;
      border-radius: 14px; border: 1px solid rgba(255,255,255,.13);
      background: linear-gradient(135deg, rgba(var(--a1),.28), rgba(var(--a2),.22)); color: #eaf6ff;
      transition: transform .5s cubic-bezier(.22,1,.36,1), box-shadow .5s;
    }
    .card:hover .card-icon{ transform: scale(1.06); box-shadow: 0 10px 26px rgba(var(--a1),.30); }
    .card-icon svg{ width: 22px; height: 22px; }
    .card p{ margin: 0; color: var(--muted); font-size: 15.5px; line-height: 1.62; }

    /* ============================================================================
       8. ПЛАТФОРМЫ
       ============================================================================ */
    .platforms{ display: flex; flex-wrap: wrap; gap: 14px; margin-top: 38px; }
    .platform{
      flex: 1 1 200px; display: flex; align-items: center; gap: 14px;
      padding: 18px 20px; border-radius: 22px;
      background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%);
      transition: transform .45s cubic-bezier(.22,1,.36,1), border-color .4s, box-shadow .45s;
    }
    .platform:hover{ transform: translateY(-4px); border-color: rgba(var(--a2),.40); box-shadow: 0 20px 44px rgba(0,0,0,.4); }
    .platform svg{ width: 26px; height: 26px; flex: none; color: var(--text); }
    .platform .p-name{ display: block; font-weight: 600; font-size: 16px; }
    .platform .p-tag{ display: block; font-size: 13px; color: var(--muted); }
    a.platform{ text-decoration: none; color: inherit; }
    .platform .p-get{
      margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 700; color: rgb(var(--a2)); white-space: nowrap;
    }
    .platform .p-get svg{ width: 16px; height: 16px; color: rgb(var(--a2)); }
    .platform .p-actions{ display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 7px; }
    .platform .p-actions a{
      font-size: 13.5px; font-weight: 700; color: rgb(var(--a2)); text-decoration: none;
      border-bottom: 1px solid rgba(var(--a2),.35); padding-bottom: 1px;
    }
    .platform .p-actions a:hover{ border-bottom-color: rgb(var(--a2)); }

    /* ============================================================================
       9. КАК ЭТО РАБОТАЕТ: 3 ШАГА + СРАВНЕНИЕ
       ============================================================================ */
    .steps{ display: flex; align-items: stretch; gap: 14px; margin-top: 42px; }
    .step{
      flex: 1 1 0; padding: 26px 24px; border-radius: var(--radius);
      background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%);
      transition: transform .55s cubic-bezier(.22,1,.36,1), border-color .45s, box-shadow .45s, opacity .45s;
      opacity: .55;
    }
    .step.active{
      opacity: 1; transform: translateY(-8px);
      border-color: rgba(var(--a2),.45);
      box-shadow: 0 26px 60px rgba(0,0,0,.45), 0 0 50px rgba(var(--a2),.16);
    }
    .step-num{
      width: 34px; height: 34px; display: grid; place-items: center; margin-bottom: 16px;
      border-radius: 50%; font-weight: 700; font-size: 15px; color: var(--text);
      background: rgba(255,255,255,.07); border: 1px solid var(--line);
    }
    .step.active .step-num{ color: #04121b; background: linear-gradient(120deg, rgb(var(--a1)), rgb(var(--a2))); border-color: transparent; }
    .step h3{ margin-bottom: 6px; }
    .step p{ margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
    .step-arrow{ display: grid; place-items: center; color: rgba(255,255,255,.28); font-size: 22px; }
    .step-arrow svg{ width: 24px; height: 24px; }

    /* Таблица сравнения */
    .compare{ margin-top: 34px; overflow: hidden; }
    .compare-head, .compare-row{ display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; align-items: center; padding: 18px 26px; }
    .compare-head{ border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 700; letter-spacing: .02em; }
    .compare-head .c-plain{ color: var(--muted); }
    .compare-head .c-tngram{ color: transparent; background: linear-gradient(100deg, var(--a1-soft), var(--a2-soft)); -webkit-background-clip: text; background-clip: text; }
    .compare-row{ border-bottom: 1px solid var(--line); font-size: 15px; }
    .compare-row:last-child{ border-bottom: 0; }
    .compare-row .c-label{ color: var(--muted); }
    .compare-row .c-plain{ color: rgba(255,140,140,.9); }
    .compare-row .c-tngram{ color: rgb(var(--a2)); font-weight: 600; }

    /* ============================================================================
       10. МОКАП ПРИЛОЖЕНИЯ (телефон + сервер)
       ============================================================================ */
    .app-demo{ display: flex; align-items: center; justify-content: center; gap: 34px; margin-top: 46px; flex-wrap: wrap; }

    /* Телефон */
    .phone{
      width: 292px; flex: none; padding: 10px; border-radius: 44px; position: relative;
      background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
      border: 1px solid var(--line); box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 60px rgba(var(--a1),.14);
    }
    .phone-screen{
      height: 560px; display: flex; flex-direction: column; overflow: hidden;
      border-radius: 36px; border: 1px solid rgba(255,255,255,.06);
      background: linear-gradient(180deg, #090d15, #05070a);
    }
    .phone-bar{ display: flex; align-items: center; gap: 10px; padding: 16px 16px 14px; border-bottom: 1px solid var(--line); }
    .phone-bar img{ width: 26px; height: 26px; border-radius: 8px; }
    .phone-bar b{ font-size: 15px; font-weight: 600; }
    .phone-bar small{ display: block; color: rgb(var(--a2)); font-size: 11.5px; font-weight: 600; }
    .chat{ flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 18px 16px; overflow-y: auto; scrollbar-width: thin; }
    .msg{
      position: relative; max-width: 82%; padding: 10px 14px; border-radius: 18px;
      font-size: 14px; line-height: 1.45; opacity: 0; transform: translateY(10px);
      transition: opacity .5s, transform .5s;
    }
    .msg.in{ opacity: 1; transform: none; }
    .msg.them{ align-self: flex-start; background: rgba(255,255,255,.07); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
    .msg.me{
      align-self: flex-end; color: #04121b; border-bottom-right-radius: 6px;
      background: linear-gradient(120deg, rgb(var(--a1)), rgb(var(--a2)));
    }
    .msg-note{
      display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
      padding: 4px 10px; border-radius: 999px;
      font-size: 11.5px; font-weight: 700; letter-spacing: .01em; line-height: 1.3;
      color: #04121b; background: rgba(255,255,255,.92);
      box-shadow: 0 4px 14px rgba(0,0,0,.28);
      opacity: 1;
    }
    .msg-note svg{ width: 12px; height: 12px; flex: none; }
    .msg.me.saved .msg-note{ opacity: 1; }
    .msg-note.second{ margin-left: 6px; background: rgba(4,18,27,.16); color: #04121b; box-shadow: none; }
    .phone-input{ display: flex; align-items: center; gap: 8px; padding: 12px 12px 16px; border-top: 1px solid var(--line); }
    .phone-input input{
      flex: 1; min-width: 0; font: inherit; font-size: 13.5px; color: var(--text);
      padding: 10px 14px; border-radius: 999px;
      background: rgba(255,255,255,.06); border: 1px solid var(--line); outline: none;
    }
    .phone-input input::placeholder{ color: rgba(153,163,178,.65); }
    .phone-input input:focus{ border-color: rgba(var(--a2),.55); box-shadow: 0 0 0 4px rgba(var(--a2),.10); }
    .phone-input button{
      width: 38px; height: 38px; flex: none; display: grid; place-items: center; cursor: pointer;
      border: 0; border-radius: 50%; color: #04121b;
      background: linear-gradient(120deg, rgb(var(--a1)), rgb(var(--a2)));
      box-shadow: 0 8px 20px rgba(var(--a1),.35);
      transition: transform .3s;
    }
    .phone-input button:hover{ transform: translateY(-2px); }
    .phone-input button svg{ width: 18px; height: 18px; }
    .demo-note{ display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
      margin: 18px auto 0; max-width: 720px; font-size: 14.5px; color: var(--muted); text-align: center; }
    .demo-note b{ color: var(--a2-soft); }
    .demo-reset{
      font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--text);
      padding: 6px 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
    }
    .demo-reset:hover{ border-color: rgba(var(--a2),.45); }

    /* Панель сервера */
    .server{ width: 320px; flex: none; padding: 22px; border-radius: var(--radius);
      background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%);
      box-shadow: 0 24px 60px rgba(0,0,0,.4);
    }
    .server-head{ display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .server-head svg{ width: 20px; height: 20px; color: var(--muted); }
    .server-head b{ font-size: 15px; }
    .server-body{ min-height: 112px; display: grid; place-items: center; padding: 16px; border-radius: 18px;
      border: 1px dashed rgba(255,255,255,.14); background: rgba(0,0,0,.25); }
    .server-msg{
      width: 100%; padding: 12px 14px; border-radius: 14px; font-size: 13.5px;
      background: rgba(255,255,255,.06); border: 1px solid var(--line);
      opacity: 0; transform: translateY(8px) scale(.98); transition: opacity .5s, transform .5s, filter .5s;
    }
    .server-msg.show{ opacity: 1; transform: none; }
    .server-msg.deleted{ opacity: .32; filter: grayscale(.6); }
    .server-msg.deleted .txt{ text-decoration: line-through; }
    .server-empty{ color: rgba(153,163,178,.55); font-size: 13.5px; }
    .server-msg.show ~ .server-empty{ display: none; }
    .server-status{ display: flex; align-items: center; gap: 9px; margin-top: 16px; font-size: 13.5px; color: var(--muted); min-height: 22px; }
    .server-status .sdot{ width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--a1)); box-shadow: 0 0 12px rgba(var(--a1),.8); }
    /* ============================================================================
       11. ТЕМЫ ОФОРМЛЕНИЯ
       ============================================================================ */
    .theme-options{ display: flex; flex-wrap: wrap; gap: 14px; margin-top: 34px; }
    .theme-btn{
      display: flex; align-items: center; gap: 14px; cursor: pointer;
      padding: 16px 22px; border-radius: 20px; font: inherit; font-size: 15px; font-weight: 600;
      color: var(--text); background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
      transition: transform .4s cubic-bezier(.22,1,.36,1), border-color .35s, box-shadow .4s, opacity .35s;
    }
    .theme-btn:hover{ transform: translateY(-3px); }
    .theme-btn[aria-pressed="true"]{ border-color: rgba(var(--a2),.55); box-shadow: 0 18px 44px rgba(0,0,0,.45), 0 0 40px rgba(var(--a2),.16); }
    .swatch{ width: 34px; height: 34px; border-radius: 12px; border: 1px solid rgba(255,255,255,.16); }
    .swatch.t-dark{ background: linear-gradient(135deg, #2f7bff, #00e08f); }
    .swatch.t-green{ background: linear-gradient(135deg, #00c484, #8ad62a); }
    .swatch.t-blue{ background: linear-gradient(135deg, #3b82f6, #8b5cf6); }

    /* ============================================================================
       12. ЧЕГО МЫ НЕ СОБИРАЕМ
       ============================================================================ */
    .nocollect{ display: grid; gap: 16px; margin-top: 38px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .nc-item{
      display: flex; gap: 16px; padding: 22px; border-radius: 22px;
      background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%);
      transition: transform .45s cubic-bezier(.22,1,.36,1), border-color .4s;
    }
    .nc-item:hover{ transform: translateY(-4px); border-color: rgba(var(--a2),.35); }
    .nc-icon{ width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 12px;
      background: rgba(255,110,110,.12); border: 1px solid rgba(255,110,110,.25); color: #ff9a9a; }
    .nc-icon svg{ width: 18px; height: 18px; }
    .nc-item h3{ font-size: 17px; }
    .nc-item p{ margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.6; }

    /* ============================================================================
       13. FAQ
       ============================================================================ */
    .faq{ margin-top: 34px; }
    .faq-item{ border-radius: 20px; background: var(--glass); border: 1px solid var(--line); margin-bottom: 12px; overflow: hidden;
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%); }
    .faq-item summary{
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 20px 24px; cursor: pointer; font-size: 17px; font-weight: 600; list-style: none;
    }
    .faq-item summary::-webkit-details-marker{ display: none; }
    .faq-item summary::after{ content: "+"; font-size: 24px; font-weight: 400; color: var(--a2-soft); transition: transform .35s; }
    .faq-item[open] summary::after{ transform: rotate(45deg); }
    .faq-item[open]{ border-color: rgba(var(--a2),.3); }
    .faq-answer{ padding: 0 24px 22px; color: var(--muted); font-size: 15.5px; line-height: 1.65; }

    /* ============================================================================
       14. ДОРОЖНАЯ КАРТА (таймлайн)
       ============================================================================ */
    .timeline{ position: relative; margin-top: 40px; padding-left: 30px; }
    .timeline::before{ content: ""; position: absolute; left: 8px; top: 10px; bottom: 10px; width: 2px;
      background: linear-gradient(180deg, rgba(var(--a2),.7), rgba(var(--a1),.35), transparent); }
    .tl-item{ position: relative; margin-bottom: 16px; padding: 20px 24px; border-radius: 22px;
      background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%);
      transition: transform .45s cubic-bezier(.22,1,.36,1), border-color .4s; }
    .tl-item:hover{ transform: translateX(4px); border-color: rgba(255,255,255,.2); }
    .tl-item::before{ content: ""; position: absolute; left: -30px; top: 28px; width: 18px; height: 18px; border-radius: 50%;
      background: var(--bg); border: 2px solid rgba(var(--a1),.7); }
    .tl-item[data-status="done"]::before{ background: rgb(var(--a2)); border-color: transparent; box-shadow: 0 0 16px rgba(var(--a2),.75); }
    .tl-item[data-status="progress"]::before{ background: linear-gradient(120deg, rgb(var(--a1)), rgb(var(--a2))); border-color: transparent; animation: pulse 2.4s ease-out infinite; }
    .tl-item p{ margin: 0; color: var(--muted); font-size: 15px; }
    .status-chip{ display: inline-block; margin-bottom: 8px; padding: 5px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      border: 1px solid var(--line); color: var(--muted); background: rgba(255,255,255,.05); }
    .status-chip[data-status="done"]{ color: rgb(var(--a2)); border-color: rgba(var(--a2),.4); background: rgba(var(--a2),.10); }
    .status-chip[data-status="progress"]{ color: var(--a1-soft); border-color: rgba(var(--a1),.4); background: rgba(var(--a1),.12); }

    /* Строки статуса (кратко о проекте) */
    .status-panel{ margin-top: 26px; padding: 6px 30px; }
    .row{ display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px;
      padding: 18px 0; border-bottom: 1px solid var(--line); }
    .row:last-child{ border-bottom: 0; }
    .row-label{ color: var(--muted); font-size: 15px; }
    .row-value{ font-size: 16px; font-weight: 600; }
    .row-value.accent{ color: transparent; background: linear-gradient(100deg, var(--a1-soft), var(--a2-soft)); -webkit-background-clip: text; background-clip: text; }

    /* ============================================================================
       15. СТАТУСЫ ФОРМ
       ============================================================================ */
    .form-status{ min-height: 22px; font-size: 14px; color: var(--muted); }
    .form-status.ok{ color: rgb(var(--a2)); }
    .form-status.err{ color: #ff9a9a; }

    /* ============================================================================
       15.5. ОПРОС (5 вопросов, свои варианты, проценты)
       ============================================================================ */
    .survey{ display: grid; gap: 16px; margin-top: 38px; }
    .q-card{ padding: 24px 24px 22px; border-radius: 26px; }
    .q-head{ display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .q-num{
      width: 30px; height: 30px; flex: none; display: grid; place-items: center;
      border-radius: 50%; font-size: 14px; font-weight: 700;
      color: var(--a2-soft); background: rgba(var(--a2),.12); border: 1px solid rgba(var(--a2),.3);
    }
    .q-title{ margin: 0; font-size: 17px; font-weight: 600; line-height: 1.4; }
    .q-sub{ display: block; margin-top: 3px; font-size: 13px; color: rgba(153,163,178,.85); }
    .q-options{ display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
    .opt{
      display: flex; align-items: center; gap: 11px; cursor: pointer;
      padding: 12px 16px; border-radius: 16px; font-size: 15px;
      background: rgba(255,255,255,.04); border: 1px solid var(--line);
      transition: border-color .3s, background .3s, transform .25s;
    }
    .opt:hover{ border-color: rgba(255,255,255,.24); background: rgba(255,255,255,.07); }
    .opt input{
      appearance: none; -webkit-appearance: none; margin: 0; flex: none;
      width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
      border: 2px solid rgba(255,255,255,.34); background: transparent;
      transition: border-color .25s, box-shadow .25s;
    }
    .opt input[type="checkbox"]{ border-radius: 6px; }
    .opt input:checked{ border-color: rgb(var(--a2)); box-shadow: inset 0 0 0 4px rgb(var(--a2)); }
    .opt:has(input:checked){ border-color: rgba(var(--a2),.55); background: rgba(var(--a2),.10); }
    .q-custom{ margin-top: 12px; display: none; }
    .q-custom.show{ display: block; }
    .q-custom input{
      width: 100%; font: inherit; font-size: 15px; color: var(--text);
      padding: 12px 18px; border-radius: 16px; outline: none;
      background: rgba(255,255,255,.05); border: 1px solid var(--line);
    }
    .q-custom input:focus{ border-color: rgba(var(--a2),.55); box-shadow: 0 0 0 4px rgba(var(--a2),.10); }
    .q-custom input::placeholder{ color: rgba(153,163,178,.6); }
    .survey-actions{ display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 4px; }
    .survey-actions .btn-primary{ padding: 14px 28px; font-size: 16px; }
    .survey-actions .btn-primary:disabled{ opacity: .55; cursor: default; transform: none; }
    .survey-actions .form-status{ margin: 0; }
    .survey-results{ margin-top: 30px; display: grid; gap: 18px; }
    .survey-results[hidden]{ display: none; }
    .res-head{ display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
    .res-head h3{ font-size: 20px; margin: 0; }
    .res-count{ font-size: 14px; color: var(--muted); }
    .res-card{ padding: 22px 24px; border-radius: 24px; }
    .res-q{ margin: 0 0 14px; font-size: 15.5px; font-weight: 600; color: var(--text); }
    .res-row{ display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin-bottom: 12px; }
    .res-row:last-child{ margin-bottom: 0; }
    .res-label{ font-size: 14.5px; color: var(--muted); }
    .res-val{ font-size: 14px; font-weight: 700; color: var(--a2-soft); white-space: nowrap; }
    .res-bar{ grid-column: 1 / -1; height: 8px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
    .res-bar span{
      display: block; height: 100%; width: 0; border-radius: 999px;
      background: linear-gradient(120deg, rgb(var(--a1)), rgb(var(--a2)));
      transition: width .9s cubic-bezier(.22,1,.36,1);
    }
    .res-custom{ margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,.14); }
    .res-custom b{ display: block; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .res-custom ul{ margin: 0; padding-left: 18px; color: var(--muted); font-size: 14.5px; }
    .res-custom li{ margin-bottom: 4px; }
    .res-custom li i{ color: var(--a2-soft); font-style: normal; font-weight: 700; }

    /* ============================================================================
       15.6. ОТКРЫТЫЙ КОД
       ============================================================================ */
    .follow-card{ max-width: 660px; margin-top: 34px; padding: 34px; border-radius: 32px; display: grid; gap: 16px; }
    .follow-card p{ margin: 0; color: var(--muted); font-size: 15.5px; }
    .follow-btn{
      display: inline-flex; align-items: center; gap: 10px; justify-self: start;
      text-decoration: none; font-size: 16px;
    }
    .follow-btn svg{ width: 20px; height: 20px; }
    .follow-url{ font-size: 14px; color: var(--a2-soft); word-break: break-all; }

    /* ============================================================================
       16. ПОДВАЛ И ПЛАВАЮЩАЯ КНОПКА
       ============================================================================ */
    .site-footer{ margin-top: 40px; padding: 34px 0 44px; border-top: 1px solid var(--line); }
    .footer-inner{ display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
    .footer-brand{ display: flex; align-items: center; gap: 10px; }
    .footer-brand img{ width: 26px; height: 26px; border-radius: 8px; }
    .footer-brand span{ font-weight: 600; }
    .footer-meta{ color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .footer-meta .sep{ opacity: .45; }
    .footer-links{ display: flex; gap: 12px; }
    .footer-links a{ color: var(--muted); font-size: 14px; text-decoration: none; transition: color .3s; }
    .footer-links a:hover{ color: var(--a2-soft); }

    .fab{
      position: fixed; right: 22px; bottom: 22px; z-index: 60; text-decoration: none;
      opacity: 0; pointer-events: none; transform: translateY(14px);
      transition: opacity .4s, transform .4s, box-shadow .35s;
    }
    .fab.show{ opacity: 1; pointer-events: auto; transform: none; }

    /* ============================================================================
       17. АДАПТИВНОСТЬ
       ============================================================================ */
    @media (max-width: 900px){
      .q-options{ grid-template-columns: 1fr; }
    }
    @media (max-width: 760px){
      .hero{ min-height: 78vh; padding: 56px 0 44px; }
      .hero-logo{ width: 88px; height: 88px; border-radius: 22px; margin-bottom: 24px; }
      section{ padding: 58px 0; }
      .status-panel{ padding: 4px 20px; }
      .row{ flex-direction: column; align-items: flex-start; }
      .steps{ flex-direction: column; }
      .step{ opacity: 1; }
      .step-arrow{ transform: rotate(90deg); padding: 2px 0; }
      .compare-head, .compare-row{ grid-template-columns: 1fr 1fr; padding: 16px 18px; }
      .compare-head span:first-child{ display: none; }
      .compare-row .c-label{ grid-column: 1 / -1; font-size: 13.5px; }
      .app-demo{ gap: 24px; }
      .phone{ width: 100%; max-width: 292px; }
      .phone-screen{ height: 470px; }
      .server{ width: 100%; max-width: 292px; }
      .follow-card{ padding: 24px; border-radius: 26px; }
      .fab{ right: 14px; bottom: 14px; padding: 12px 20px; font-size: 14px; }
    }

    /* Уважаем настройку «меньше движения» */
    @media (prefers-reduced-motion: reduce){
      *{ animation: none !important; transition: none !important; }
      .reveal{ opacity: 1 !important; transform: none !important; }
      html{ scroll-behavior: auto; }
    }
  </style>

<body>

  <!-- Фоновые цветные пятна -->
  <div class="bg" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- ==========================================================================
       ШАПКА: логотип, название, переключатель языка
       ========================================================================== -->
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#top">
        <img src="icon.png" alt="" data-logo/>
        <span data-i18n="brand">Тнграм</span>
      </a>
      <div class="header-right">
        <div class="mode-tabs" role="tablist">
          <button type="button" data-mode="site" aria-selected="true">Сайт</button>
          <button type="button" data-mode="chat" aria-selected="false"><span class="tab-dot" aria-hidden="true"></span>Мессенджер</button>
        </div>
        <div class="lang" role="group" aria-label="Language" id="lang-switch">
          <button type="button" data-lang="ru" aria-pressed="true">RU</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <div id="webapp-shell"></div>

  <!-- Маленькое окно при открытии: приглашение пройти тест -->
  <div class="welcome" id="welcome" role="dialog" aria-live="polite" aria-label="Тест">
    <div class="welcome-inner">
      <span class="welcome-icon" aria-hidden="true">?</span>
      <div class="welcome-text">
        <b data-i18n="welcome.title"></b>
        <span data-i18n="welcome.text"></span>
      </div>
      <button class="welcome-cta" type="button" id="welcome-go" data-i18n="welcome.button"></button>
      <button class="welcome-close" type="button" id="welcome-close" aria-label="Закрыть">×</button>
    </div>
  </div>

  <main id="top">
  <div id="landing-main">
    <!-- ========================================================================
         ГЛАВНЫЙ ЭКРАН
         ======================================================================== -->
    <section class="hero wrap">
      <div>
        <img class="hero-logo" src="icon.png" alt="Тнграм" data-logo/>
        <h1 class="gradient-text" data-i18n="hero.title">Тнграм</h1>
        <p class="slogan" data-i18n="hero.slogan"></p>
        <p class="sub" data-i18n="hero.sub"></p>
        <div class="badge"><span class="dot" aria-hidden="true"></span><span data-i18n="hero.badge"></span></div>
        <div class="hero-cta">
          <a class="btn-primary" href="TNGram.apk" download data-i18n="hero.download"></a>
          <a class="btn-ghost" href="#how">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            <span data-i18n="hero.howLink"></span>
          </a>
        </div>
      </div>
    </section>

    <!-- ========================================================================
         ЧТО ЭТО
         ======================================================================== -->
    <section class="wrap reveal" id="about">
      <p class="eyebrow gradient-text" data-i18n="about.eyebrow"></p>
      <h2 data-i18n="about.title"></h2>
      <p class="lead" data-i18n="about.p1"></p>
      <p class="lead" data-i18n="about.p2"></p>
    </section>

    <!-- ========================================================================
         ВОЗМОЖНОСТИ (карточки рисуются из TEXTS)
         ======================================================================== -->
    <section class="wrap" id="features">
      <div class="reveal">
        <p class="eyebrow gradient-text" data-i18n="features.eyebrow"></p>
        <h2 data-i18n="features.title"></h2>
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <!-- ========================================================================
         ПЛАТФОРМЫ
         ======================================================================== -->
    <section class="wrap" id="platforms">
      <div class="reveal">
        <p class="eyebrow gradient-text" data-i18n="platforms.eyebrow"></p>
        <h2 data-i18n="platforms.title"></h2>
        <p class="lead" data-i18n="platforms.lead"></p>
      </div>
      <div class="platforms" id="platform-list"></div>
    </section>
    <!-- ========================================================================
         КАК ЭТО РАБОТАЕТ: 3 шага + сравнение
         ======================================================================== -->
    <section class="wrap" id="how">
      <div class="reveal">
        <p class="eyebrow gradient-text" data-i18n="how.eyebrow"></p>
        <h2 data-i18n="how.title"></h2>
        <p class="lead" data-i18n="how.lead"></p>
      </div>

  /* Платформы */
  function renderPlatforms(lang){
    const p = TEXTS[lang].platforms;
    $('#platform-list').innerHTML = p.items.map((item, i) => {
      const name = typeof item === 'string' ? item : item.name;
      const tag  = typeof item === 'string' ? p.tag   : item.tag;
      const href = typeof item === 'string' ? ''      : (item.href || '');
      const web  = typeof item === 'string' ? false   : !!item.web;

      /* Одна ссылка — вся карточка кликабельна; две и больше — кнопки внутри */
      const actions = (typeof item !== 'string' && Array.isArray(item.actions))
        ? item.actions
        : (href ? [{ label: web ? (p.open || p.download) : p.download, href, external: web }] : []);

      const linksBlock = actions.length > 1
        ? `<span class="p-actions">${actions.map((a) => `<a href="${a.href}"${a.external ? ' target="_blank" rel="noopener"' : ''}>${a.label}</a>`).join('')}</span>`
        : '';

      const inner = `
        ${PLATFORM_ICONS[i] || ''}
        <div>
          <span class="p-name">${name}</span>
          <span class="p-tag">${tag}</span>
          ${linksBlock}

        <h3>${item.title}</h3>
        <p>${item.text}</p>
      </div>`).join('');
  }

  /* Короткие строки статуса */
  function renderStatusRows(lang){
    $('#status-rows').innerHTML = TEXTS[lang].roadmap.rows.map((row) => `
      <div class="row">
        <span class="row-label">${row.label}</span>
        <span class="row-value${row.accent ? ' accent' : ''}">${row.value}</span>
      </div>`).join('');
  }

  /* Кнопки тем оформления */
  function renderThemes(lang){
    $('#theme-options').innerHTML = TEXTS[lang].themes.options.map((theme) => `
      <button class="theme-btn" type="button" data-theme="${theme.id}" aria-pressed="false">
        <span class="swatch t-${theme.id}" aria-hidden="true"></span>${theme.name}
      </button>`).join('');
  }
  /* ===========================================================================
     МОКАП: сообщение появляется в чате, ненадолго попадает на сервер и удаляется
     =========================================================================== */
  let demoTimers = [];
  const clearDemo = () => { demoTimers.forEach(clearTimeout); demoTimers = []; };
  const later = (ms, fn) => demoTimers.push(setTimeout(fn, ms));

  /* Пользователь начал играть сам — авто-показ останавливается */
  let userPlaying = false;
  /* Свои сообщения в демо-чате (никуда не отправляются) */
  const ownMessages = [];

  function renderDemo(lang){
    clearDemo();
    userPlaying = false;
    ownMessages.length = 0;
    const m = TEXTS[lang].mockup;
    $('#chat').innerHTML = m.chat.map((msg) => `
      <div class="msg ${msg.from}">
        <span class="txt">${msg.text}</span>
        ${msg.from === 'me' ? `<span class="msg-note">${LOCK_ICON}${m.savedNote}</span>` : ''}
      </div>`).join('');

    /* Какое сообщение «отправим» на сервер — последнее исходящее */
    const sent = m.chat.filter((x) => x.from === 'me').slice(-1)[0];
    $('#server-msg .txt').textContent = sent ? sent.text : '';
    $('#server-msg').classList.remove('show', 'deleted');
    $('#server-status-text').textContent = '';
    renderDemoHint();
    const input = $('#phone-text');
    if (input) input.value = '';
  }

  /* Подпись под макетом: меняется, когда пользователь пишет сам */
  function renderDemoHint(){
    const m = TEXTS[currentLang].mockup;
    const box = $('#demo-note');
    if (!box) return;
    box.innerHTML = userPlaying
      ? `<span>${m.demoHintActive}</span><button class="demo-reset" type="button" id="demo-reset">${m.demoReset}</button>`
      : `<span>${m.demoHint}</span>`;
  }

  function addOwnMessage(text){
    const m = TEXTS[currentLang].mockup;
    const chat = $('#chat');
    const bubble = document.createElement('div');
    bubble.className = 'msg me';
    bubble.innerHTML = `<span class="txt"></span>
      <span class="msg-note">${LOCK_ICON}${m.savedNote}</span>
      <span class="msg-note second">${m.notSent}</span>`;
    bubble.querySelector('.txt').textContent = text;
    chat.appendChild(bubble);
    requestAnimationFrame(() => bubble.classList.add('in'));
    chat.scrollTop = chat.scrollHeight;
  }

  function sendOwnMessage(){
    const m = TEXTS[currentLang].mockup;
    const input = $('#phone-text');
    if (!input) return;
    const text = (input.value || '').trim();
    if (!text) return;
    if (!userPlaying){
      /* первый свой — выключаем авто-показ и убираем демо-сообщения */
      userPlaying = true;
      clearDemo();
      ownMessages.length = 0;
      $('#chat').innerHTML = '';
      renderDemoHint();
    }
    ownMessages.push(text);
    input.value = '';
    addOwnMessage(text);

    /* Сервер: имитация — сообщение «появляется» и тут же удаляется */
    const serverMsg = $('#server-msg');
    const statusText = $('#server-status-text');
    clearDemo();
    serverMsg.querySelector('.txt').textContent = text;
    serverMsg.classList.remove('deleted');
    serverMsg.classList.add('show');
    statusText.textContent = m.statuses[0];
    later(900, () => { statusText.textContent = m.statuses[1]; });
    later(1700, () => {
      serverMsg.classList.add('deleted');
      statusText.textContent = m.statuses[2];
    });
  }

  function runDemo(lang){
    clearDemo();
    if (userPlaying) return;
    const m = TEXTS[lang].mockup;
    const bubbles = $$('#chat .msg');
    const serverMsg = $('#server-msg');
    const statusText = $('#server-status-text');

    const reset = () => {
      bubbles.forEach((b) => b.classList.remove('in', 'saved'));
      serverMsg.classList.remove('show', 'deleted');
      statusText.textContent = '';
    };

    /* Если включён режим «меньше движения» — показываем финальный кадр без цикла */
    if (reduceMotion){
      bubbles.forEach((b) => b.classList.add('in'));
      serverMsg.classList.add('show', 'deleted');
      statusText.textContent = m.statuses[2];
      return;
    }

    reset();
    later(500,  () => { if (bubbles[0]) bubbles[0].classList.add('in'); });     // приходит сообщение
    later(1300, () => { if (bubbles[1]) bubbles[1].classList.add('in'); });     // отвечаем
    later(2200, () => { serverMsg.classList.add('show'); statusText.textContent = m.statuses[0]; }); // на сервере
    later(3800, () => { statusText.textContent = m.statuses[1]; });             // передано
    later(5200, () => { serverMsg.classList.add('deleted'); statusText.textContent = m.statuses[2]; }); // удалено
    later(6000, () => { if (bubbles[1]) bubbles[1].classList.add('saved'); });   // осталось только у тебя
    later(8800, reset);                                                        // сброс
    later(9200, () => runDemo(lang));                                          // и снова по кругу
  }

  /* Ввод в макете: сообщение остаётся в браузере и никуда не уходит */
  $('#phone-send').innerHTML = SEND_ICON;
  $('#phone-form').addEventListener('submit', (event) => {
    event.preventDefault();
    sendOwnMessage();
  });
  $('#demo-note').addEventListener('click', (event) => {
    if (event.target.closest('#demo-reset')){
      renderDemo(currentLang);
      runDemo(currentLang);
    }
  });
  /* ===========================================================================
     ТЕМЫ ОФОРМЛЕНИЯ
     =========================================================================== */
  const THEME_KEY = 'tngram-theme';

  function setTheme(id){
    document.documentElement.dataset.theme = id;
    $$('#theme-options .theme-btn').forEach((btn) => {
      btn.setAttribute('aria-pressed', String(btn.dataset.theme === id));
    });
    try { localStorage.setItem(THEME_KEY, id); } catch (e) {}
  }

  /* Клик по теме */
  $('#theme-options').addEventListener('click', (event) => {
    const btn = event.target.closest('button[data-theme]');
    if (btn) setTheme(btn.dataset.theme);
  });

  /* ===========================================================================
     ПОЯВЛЕНИЕ ПРИ СКРОЛЛЕ + ПОДСВЕТКА ШАГОВ ПО ОЧЕРЕДИ
     =========================================================================== */
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const observer = ('IntersectionObserver' in window && !reduceMotion)
    ? new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting){
            entry.target.classList.add('in');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' })
    : null;

  function observeReveals(){
    if (!observer){
      $$('.reveal').forEach((el) => el.classList.add('in'));
      return;
    }
    $$('.reveal:not(.in)').forEach((el) => observer.observe(el));
  }

  /* Шаг «загорается» по мере прокрутки секции: 1 → 2 → 3 */
  function updateSteps(){
    const steps = $$('#steps .step');
    if (!steps.length) return;
    const box = $('#steps').getBoundingClientRect();
    const start = window.innerHeight * 0.85;          /* когда секция входит снизу */
    const total = box.height + window.innerHeight * 0.45;
    const progress = Math.min(1, Math.max(0, (start - box.top) / total));
    let active = Math.min(steps.length - 1, Math.floor(progress * steps.length));
    if (progress <= 0) active = 0;
    steps.forEach((step, i) => step.classList.toggle('active', i <= active));
  }

  /* Не чаще одного кадра в секунду-кадра: считаем по requestAnimationFrame */
  let scrollQueued = false;
  function onScroll(){
    if (scrollQueued) return;
    scrollQueued = true;
    requestAnimationFrame(() => { scrollQueued = false; updateSteps(); updateFab(); });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  /* ===========================================================================
     ЯЗЫК
     =========================================================================== */
  function renderAll(lang){
    applyStaticTexts(lang);
    renderCards(lang);
    renderPlatforms(lang);
    renderSteps(lang);
    renderCompare(lang);
    renderNoCollect(lang);
    renderFaq(lang);
    renderTimeline(lang);
    renderStatusRows(lang);
    renderThemes(lang);
    renderSurvey();
    renderDemo(lang);
    runDemo(lang);
    observeReveals();
    updateSteps();
    setTheme(document.documentElement.dataset.theme || 'dark');
  }

  function setLang(lang){
    currentLang = TEXTS[lang] ? lang : 'ru';
    const t = TEXTS[currentLang];

    document.documentElement.lang = currentLang;
    document.title = t.meta.title;
    const setMeta = (sel, value) => { const el = $(sel); if (el) el.setAttribute('content', value); };
    setMeta('#og-title', t.meta.title);
    setMeta('#og-desc', t.meta.description);
    setMeta('meta[name="description"]', t.meta.description);

    $$('#lang-switch button').forEach((btn) => {
      btn.setAttribute('aria-pressed', String(btn.dataset.lang === currentLang));
    });

    renderAll(currentLang);
    try { localStorage.setItem('tngram-lang', currentLang); } catch (e) {}
  }

  $('#lang-switch').addEventListener('click', (event) => {
    const btn = event.target.closest('button[data-lang]');
    if (btn) setLang(btn.dataset.lang);
  });

  /* ===========================================================================
     ОПРОС: пять вопросов, свои варианты, проценты ответов
     =========================================================================== */
  const SURVEY_KEY = 'tngram-survey-votes';
  const SURVEY_MAX = 2;                    /* сколько вариантов можно в 4-м вопросе */

  const surveyText = () => TEXTS[currentLang].survey;

  const escapeHtml = (str) => String(str).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function renderSurvey(){
    const s = surveyText();
    $('#survey-list').innerHTML = s.questions.map((q, i) => `
      <div class="q-card panel reveal" data-q="${q.id}" style="--d:${i * 60}ms">
        <div class="q-head">
          <span class="q-num">${i + 1}</span>
          <div>
            <h3 class="q-title">${q.title}</h3>
            <span class="q-sub">${q.sub || (q.multi ? s.multi : s.single)}</span>
          </div>
        </div>
        <div class="q-options">
          ${q.options.map((o) => `
            <label class="opt">
              <input type="${q.multi ? 'checkbox' : 'radio'}" name="${q.id}" value="${o.id}" data-free="${o.free ? '1' : '0'}"/>
              <span class="o-label">${o.label}</span>
            </label>`).join('')}
        </div>
        ${q.options.some((o) => o.free) ? `
          <div class="q-custom">
            <input type="text" maxlength="60" placeholder="${s.otherPlaceholder}" aria-label="${s.otherPlaceholder}"/>
          </div>` : ''}
      </div>`).join('');

    const status = $('#survey-status');
    status.textContent = '';
    status.className = 'form-status';
    const btn = $('#survey-submit');
    btn.disabled = false;
    btn.textContent = s.submit;

    const box = $('#survey-results');
    box.hidden = true;
    box.innerHTML = '';

    /* Если на этом устройстве уже отвечали — сразу показываем проценты */
    const local = readLocalSurvey();
    if (local.length) renderResults(aggregate(local, true), 'local');
  }

  /* Выбор вариантов: не больше двух и показ поля «свой вариант» */
  function onSurveyChange(event){
    const input = event.target.closest('input[type="radio"], input[type="checkbox"]');
    if (!input) return;

    const card = input.closest('.q-card');
    const status = $('#survey-status');

    if (input.type === 'checkbox'){
      const checked = card.querySelectorAll('input:checked');
      if (checked.length > SURVEY_MAX){
        input.checked = false;
        status.textContent = surveyText().maxTwo;
        status.className = 'form-status err';
        return;
      }
    }

    const free = card.querySelector('input[data-free="1"]');
    const customBox = card.querySelector('.q-custom');
    if (customBox){
      const shown = !!(free && free.checked);
      customBox.classList.toggle('show', shown);
      if (shown) customBox.querySelector('input').focus();
    }

    status.textContent = '';
    status.className = 'form-status';
  }

  /* Собираем ответы в строки {q, a, custom, text} */
  function collectSurvey(){
    const s = surveyText();
    const rows = [];
    let missing = false, emptyFree = false;

    s.questions.forEach((q) => {
      const card = document.querySelector('.q-card[data-q="' + q.id + '"]');
      if (!card) return;
      const picked = Array.from(card.querySelectorAll('input:checked'));
      if (!picked.length){ missing = true; return; }

      const customInput = card.querySelector('.q-custom input');
      picked.forEach((input) => {
        const opt = q.options.find((o) => o.id === input.value) || {};
        if (opt.free){
          const text = customInput ? customInput.value.trim() : '';
          if (!text){ emptyFree = true; return; }
          rows.push({ q: q.id, a: input.value, custom: true, text });
        } else {
          rows.push({ q: q.id, a: input.value, custom: false, text: '' });
        }
      });
    });

    return { rows, missing, emptyFree };
  }

  /* --- сохранение -------------------------------------------------------- */
  function readLocalSurvey(){
    try {
      const data = JSON.parse(localStorage.getItem(SURVEY_KEY) || '[]');
      return Array.isArray(data) ? data : [];
    } catch (e) { return []; }
  }

  function saveLocalSurvey(rows){
    try {
      localStorage.setItem(SURVEY_KEY, JSON.stringify(readLocalSurvey().concat(rows)));
    } catch (e) {}
  }

  /* --- отправка в облако (если настроено) -------------------------------- */
  async function uploadSurvey(rows){
    const cfg = CONFIG.survey;
    if (!cfg.enabled || !cfg.url || !cfg.key) return;
    try {
      const res = await fetch(cfg.url + '/rest/v1/' + cfg.table, {
        method: 'POST',
        headers: {
          'apikey': cfg.key,
          'Authorization': 'Bearer ' + cfg.key,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(rows.map((r) => ({ q: r.q, answer: r.a, custom: r.custom, text: r.text })))
      });
      if (!res.ok) throw new Error('http ' + res.status);
      await loadTally();
    } catch (e) {
      /* облако ещё не настроено — остаются проценты по этому устройству */
    }
  }

  async function loadTally(){
    const cfg = CONFIG.survey;
    if (!cfg.enabled || !cfg.url || !cfg.key) return;
    try {
      const res = await fetch(cfg.url + '/rest/v1/' + cfg.tally + '?select=q,answer,custom,text,votes', {
        headers: { 'apikey': cfg.key, 'Authorization': 'Bearer ' + cfg.key }
      });
      if (!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      if (!Array.isArray(data) || !data.length) throw new Error('empty');
      renderResults(aggregate(data, false), 'remote');
    } catch (e) {
      const local = readLocalSurvey();
      if (local.length) renderResults(aggregate(local, true), 'local');
    }
  }

  /* --- подсчёт процентов -------------------------------------------------- */
  function aggregate(source, local){
    const out = {};
    const add = (q, key, custom, text, votes) => {
      if (!out[q]) out[q] = { total: 0, byKey: {}, custom: {} };
      out[q].total += votes;
      if (custom) out[q].custom[text] = (out[q].custom[text] || 0) + votes;
      else out[q].byKey[key] = (out[q].byKey[key] || 0) + votes;
    };
    source.forEach((r) => {
      const votes = local ? 1 : (Number(r.votes) || 0);
      add(r.q, local ? r.a : r.answer, !!r.custom, r.text || '', votes);
    });
    return out;
  }

  function renderResults(data, mode){
    const s = surveyText();
    const box = $('#survey-results');
    const first = s.questions[0].id;
    const answered = (data[first] && data[first].total) || 0;

    const cards = s.questions.map((q, i) => {
      const stat = data[q.id];
      if (!stat || !stat.total) return '';
      const pct = (n) => Math.round((n / stat.total) * 100);

      const rows = q.options.filter((o) => !o.free).map((o) => {
        const n = stat.byKey[o.id] || 0;
        return `
          <div class="res-row">
            <span class="res-label">${o.label}</span>
            <span class="res-val">${pct(n)}% · ${n}</span>
            <span class="res-bar"><span data-w="${pct(n)}"></span></span>
          </div>`;
      }).join('');

      const custom = Object.entries(stat.custom || {})
        .filter(([text]) => text)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6);

      const customBlock = custom.length ? `
        <div class="res-custom">
          <b>${s.customTitle}</b>
          <ul>${custom.map(([text, n]) => `<li>${escapeHtml(text)} — <i>${pct(n)}%</i></li>`).join('')}</ul>
        </div>` : '';

      return `
        <div class="res-card panel">
          <p class="res-q">${i + 1}. ${q.title}</p>
          ${rows}
          ${customBlock}
        </div>`;
    }).join('');

    if (!answered || !cards){ box.hidden = true; return; }

    box.innerHTML = `
      <div class="res-head">
        <h3>${s.resultsTitle}</h3>
        <span class="res-count">${s.resultsCount.replace('%n', answered)}</span>
      </div>
      <p class="note" style="margin:0">${mode === 'local' ? s.resultsLocal : s.resultsNote}</p>
      ${cards}`;
    box.hidden = false;

    /* полоски заполняются после появления в разметке */
    requestAnimationFrame(() => {
      box.querySelectorAll('.res-bar span').forEach((el) => {
        el.style.width = (el.dataset.w || 0) + '%';
      });
    });
  }

  function submitSurvey(event){
    event.preventDefault();
    const s = surveyText();
    const status = $('#survey-status');
    const { rows, missing, emptyFree } = collectSurvey();

    if (missing || emptyFree || !rows.length){
      status.textContent = missing ? s.needAll : s.needOther;
      status.className = 'form-status err';
      return;
    }

    saveLocalSurvey(rows);
    renderResults(aggregate(readLocalSurvey(), true), 'local');
    status.textContent = s.thanks;
    status.className = 'form-status ok';
    $('#survey-submit').disabled = true;

    uploadSurvey(rows);
  }

  $('#survey-form').addEventListener('change', onSurveyChange);
  $('#survey-form').addEventListener('submit', submitSurvey);

  /* Ссылки на проект: пустая ссылка = кнопка скрыта */
  function applyLinks(){
    const github = CONFIG.links.github;
    const foot = $('#foot-github');
    if (foot){
      if (github){ foot.setAttribute('href', github); foot.hidden = false; }
      else foot.hidden = true;
    }
    const tg = $('#foot-telegram');
    if (tg) tg.hidden = !CONFIG.links.telegram;
  }

  /* ===========================================================================
     МЕЛОЧИ: плавающая кнопка, год, своя иконка, свечение под курсором
     =========================================================================== */
  function updateFab(){
    $('#fab').classList.toggle('show', window.scrollY > 600);
  }

  $('#year').textContent = new Date().getFullYear();

  /* Мягкое свечение под курсором на карточках */
  document.addEventListener('pointermove', (event) => {
    const card = event.target.closest && event.target.closest('.card');
    if (!card) return;
    const r = card.getBoundingClientRect();
    card.style.setProperty('--mx', ((event.clientX - r.left) / r.width) * 100 + '%');
    card.style.setProperty('--my', ((event.clientY - r.top) / r.height) * 100 + '%');
  });

  /* ===========================================================================
     МАЛЕНЬКОЕ ОКНО ПРИ ОТКРЫТИИ: «пройдите, пожалуйста, тест»
     =========================================================================== */
  const welcomeBox = $('#welcome');
  let welcomeTimer = null;

  function hideWelcome(){
    clearTimeout(welcomeTimer);
    welcomeBox.classList.remove('show');
  }

  function showWelcome(){
    welcomeTimer = setTimeout(() => {
      if (window.scrollY < 200) welcomeBox.classList.add('show');
    }, 800);
  }

  $('#welcome-go').addEventListener('click', () => {
    hideWelcome();
    const survey = $('#survey');
    if (survey) survey.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
    const first = document.querySelector('#survey-list .opt input');
    if (first) setTimeout(() => first.focus({ preventScroll: true }), reduceMotion ? 0 : 700);
  });

  $('#welcome-close').addEventListener('click', hideWelcome);

  /* Прокрутили страницу — окно больше не нужно */
  window.addEventListener('scroll', () => {
    if (window.scrollY > 400) hideWelcome();
  }, { passive: true });

  /* ------------------------------------------------------------------ старт -- */
  (function init(){
    /* Язык: сохранённый или русский по умолчанию */
    let startLang = 'ru';
    let startTheme = 'dark';
    try {
      const lang = localStorage.getItem('tngram-lang');
      if (lang === 'ru' || lang === 'en') startLang = lang;
      const theme = localStorage.getItem(THEME_KEY);
      if (theme) startTheme = theme;
    } catch (e) {}

    document.documentElement.dataset.theme = startTheme;
    applyLinks();
    setLang(startLang);
    updateFab();
    loadTally();
    showWelcome();
  })();

  </script>
  <script src="web_app.js"></script>
</body>
</html>
