# Держим бесплатный проект Supabase «живым».
# Бесплатный проект засыпает после 7 дней без запросов. Этот файл раз в сутки
# делает один безобидный запрос к таблице сообщений — и проект не засыпает.
#
# Ключ здесь публичный (publishable) — такой же лежит в самом приложении.

name: Keep cloud awake

on:
  schedule:
    - cron: "23 4 * * *" # каждый день в 04:23 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Пинг облака
        env:
          SUPABASE_KEY: sb_publishable_eyJSH1Zs1IDEeE61009XDw_cQt5ujXj
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "https://hqmgjnloilemdwejzoyy.supabase.co/rest/v1/messages?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
