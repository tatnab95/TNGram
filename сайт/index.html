<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Тнграм — приватный мессенджер</title>
  <meta name="description" content="Тнграм — приватный мессенджер. Сообщение доставлено и сразу удалено с сервера. Переписка хранится только на твоём устройстве."/>
  <meta name="theme-color" content="#05070a"/>

  <!-- Иконка сайта (favicon). Файл icon.png лежит рядом с index.html -->
  <link rel="icon" href="icon.png" type="image/png" id="favicon"/>
  <link rel="apple-touch-icon" href="icon.png"/>

  <!-- Превью при отправке ссылки в мессенджерах -->
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Тнграм — приватный мессенджер" id="og-title"/>
  <meta property="og:description" content="Приватный мессенджер без хранения переписки на сервере. Уже можно скачать." id="og-desc"/>
  <meta property="og:image" content="icon.png"/>

  <style>
    /* ============================================================================
       1. ЦВЕТА И НАСТРОЙКИ — меняй оформление здесь
       ----------------------------------------------------------------------------
       --a1 / --a2  — основные акценты (записываются как "47,123,255" без rgb())
       --a1-soft / --a2-soft — те же цвета, но светлее: для текста и градиентов
       Темы ниже можно менять и дополнять: [data-theme="имя"].
       ============================================================================ */
    :root{
      --bg:            #05070a;                  /* основной тёмный фон */
      --text:          #f4f7fb;                  /* основной текст */
      --muted:         #99a3b2;                  /* вторичный текст */
      --line:          rgba(255,255,255,.10);    /* тонкая светлая обводка */
      --glass:         rgba(255,255,255,.055);   /* стеклянная подложка */
      --radius:        26px;                     /* скругление карточек */
      --blur:          22px;                     /* сила размытия стекла */
      --maxw:          1080px;                   /* ширина контента */
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
              Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Тема 1 — «Тёмная» (по умолчанию): синий + зелёный */
    :root, :root[data-theme="dark"]{
      --a1: 47,123,255;      --a2: 0,224,143;      --a3: 122,92,255;
      --a1-soft: #a9c8ff;    --a2-soft: #7ff0c4;
    }
    /* Тема 2 — «Зелёная» */
    :root[data-theme="green"]{
      --a1: 0,196,132;       --a2: 138,214,42;     --a3: 0,166,196;
      --a1-soft: #96f0cd;    --a2-soft: #c6f07a;
    }
    /* Тема 3 — «Синяя» */
    :root[data-theme="blue"]{
      --a1: 59,130,246;      --a2: 139,92,246;     --a3: 56,189,248;
      --a1-soft: #b6c9ff;    --a2-soft: #cbb4ff;
    }

    /* Градиентный текст (заголовки-акценты) */
    .gradient-text{
      background: linear-gradient(100deg, #ffffff 0%, var(--a1-soft) 48%, var(--a2-soft) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }

    /* ============================================================================
       2. БАЗА
       ============================================================================ */
    *,*::before,*::after{ box-sizing: border-box; }
    html{ scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body{
      margin: 0; font-family: var(--font); color: var(--text); background: var(--bg);
      line-height: 1.6; overflow-x: hidden;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    img{ max-width: 100%; display: block; }
    ::selection{ background: rgba(var(--a1), .4); }
    .wrap{ width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: 22px; }

    /* Плавная смена цветов при переключении темы */
    body, .bg, .card, .panel, .badge, .card-icon, .chip, .step, .phone, .btn-ghost, .lang{
      transition: background-color .6s ease, border-color .6s ease, box-shadow .6s ease, color .6s ease;
    }

    /* ============================================================================
       3. ФОН: плавающие размытые цветные пятна
       ============================================================================ */
    .bg{
      position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
      background:
        radial-gradient(1100px 700px at 12% -12%, rgba(var(--a1),.20), transparent 62%),
        radial-gradient(900px 650px at 92% 4%,   rgba(var(--a2),.15), transparent 62%),
        radial-gradient(900px 900px at 50% 120%, rgba(var(--a3),.13), transparent 65%);
    }
    .blob{ position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; animation: drift 22s ease-in-out infinite alternate; }
    .blob-1{ width: 46vw; height: 46vw; left: -6vw; top: -8vh;  background: radial-gradient(circle, rgba(var(--a1),.85), transparent 68%); }
    .blob-2{ width: 38vw; height: 38vw; right: -4vw; top: 18vh; background: radial-gradient(circle, rgba(var(--a2),.70), transparent 68%); animation-delay: -6s; }
    .blob-3{ width: 34vw; height: 34vw; left: 28vw; bottom: -6vh; background: radial-gradient(circle, rgba(var(--a3),.55), transparent 70%); animation-delay: -12s; }
    @keyframes drift{
      from{ transform: translate3d(0,0,0) scale(1); }
      to  { transform: translate3d(5vw,-5vh,0) scale(1.18); }
    }

    /* ============================================================================
       4. ШАПКА
       ============================================================================ */
    .site-header{
      position: sticky; top: 0; z-index: 50;
      background: rgba(5,7,10,.62);
      -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
      border-bottom: 1px solid var(--line);
    }
    .header-inner{ min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand{ display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .brand img{ width: 34px; height: 34px; border-radius: 10px; box-shadow: 0 8px 22px rgba(var(--a1),.35), 0 0 0 1px rgba(255,255,255,.10) inset; }
    .brand span{ font-size: 17px; font-weight: 600; letter-spacing: -.01em; }

    /* Переключатель языка RU / EN */
    .lang{
      display: flex; align-items: center; gap: 2px; padding: 3px;
      border: 1px solid var(--line); border-radius: 999px; background: var(--glass);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    }
    .lang button{
      font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .02em;
      color: var(--muted); background: none; border: 0; cursor: pointer;
      padding: 6px 13px; border-radius: 999px;
      transition: color .25s, background .35s, box-shadow .35s;
    }
    .lang button:hover{ color: var(--text); }
    .lang button[aria-pressed="true"]{
      color: #fff; background: linear-gradient(120deg, rgba(var(--a1),.85), rgba(var(--a2),.75));
      box-shadow: 0 6px 18px rgba(var(--a1),.35);
    }

    /* ============================================================================
       5. ГЛАВНЫЙ ЭКРАН
       ============================================================================ */
    .hero{ min-height: 88vh; display: grid; place-items: center; text-align: center; padding: 84px 0 64px; }
    .hero-logo{
      width: 116px; height: 116px; margin: 0 auto 30px; border-radius: 28px;
      animation: float 7s ease-in-out infinite;
      box-shadow: 0 0 0 1px rgba(255,255,255,.10), 0 26px 70px rgba(var(--a1),.30);
    }
    @keyframes float{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-12px); } }
    .hero h1{ margin: 0 0 18px; font-weight: 700; letter-spacing: -.035em; line-height: 1.02; font-size: clamp(52px, 10vw, 96px); }
    .hero .slogan{ margin: 0 auto; max-width: 640px; color: var(--muted); font-size: clamp(17px, 2.3vw, 21px); line-height: 1.55; }
    .hero .sub{ margin: 14px auto 0; max-width: 560px; color: rgba(153,163,178,.75); font-size: clamp(14px, 1.7vw, 16px); }

    /* Плашка «Скоро» */
    .badge{
      display: inline-flex; align-items: center; gap: 9px; margin-top: 34px;
      padding: 9px 18px; border-radius: 999px;
      font-size: 14px; font-weight: 600; letter-spacing: .04em; color: #dff7ec;
      background: linear-gradient(120deg, rgba(var(--a1),.22), rgba(var(--a2),.20));
      border: 1px solid rgba(255,255,255,.16);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      box-shadow: 0 12px 34px rgba(0,0,0,.35), 0 0 34px rgba(var(--a2),.14);
    }
    .badge .dot{ width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--a2)); animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse{
      0%{ box-shadow: 0 0 0 0 rgba(var(--a2),.55); }
      70%{ box-shadow: 0 0 0 12px rgba(var(--a2),0); }
      100%{ box-shadow: 0 0 0 0 rgba(var(--a2),0); }
    }

    /* Кнопки под плашкой: «Скачать» и «Как это работает» */
    .hero-cta{ display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 26px; }
    .hero-cta .btn-primary, .hero-cta .btn-ghost{ text-decoration: none; }

    /* ============================================================================
       6. ОБЩЕЕ ДЛЯ СЕКЦИЙ
       ============================================================================ */
    section{ padding: 76px 0; scroll-margin-top: 86px; }
    .eyebrow{ margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h2{ margin: 0 0 20px; font-weight: 700; letter-spacing: -.025em; line-height: 1.12; font-size: clamp(30px, 4.6vw, 46px); }
    h3{ margin: 0 0 8px; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
    .lead{ margin: 0; max-width: 760px; color: var(--muted); font-size: clamp(16px, 2vw, 19px); }
    .lead + .lead{ margin-top: 16px; }
    .note{ margin: 16px 0 0; color: rgba(153,163,178,.8); font-size: 15px; }

    /* Стеклянная панель (универсальная) */
    .panel{
      border-radius: var(--radius); background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%);
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }

    /* Кнопки */
    .btn-primary{
      padding: 14px 26px; border-radius: 999px; border: 0; cursor: pointer;
      font: inherit; font-weight: 600; color: #04121b;
      background: linear-gradient(120deg, rgb(var(--a1)), rgb(var(--a2)));
      box-shadow: 0 14px 34px rgba(var(--a1),.32);
      transition: transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s;
    }
    .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 20px 44px rgba(var(--a1),.42); }
    .btn-ghost{
      display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
      padding: 13px 22px; border-radius: 999px; font-weight: 600; font-size: 15px;
      color: var(--text); background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      transition: transform .35s cubic-bezier(.22,1,.36,1), border-color .35s, box-shadow .35s;
    }
    .btn-ghost:hover{ transform: translateY(-2px); border-color: rgba(var(--a2),.45); box-shadow: 0 16px 38px rgba(0,0,0,.4); }
    .btn-ghost svg{ width: 18px; height: 18px; }

    /* Появление при скролле */
    .reveal{ opacity: 0; transform: translateY(26px); transition: opacity .9s cubic-bezier(.22,1,.36,1), transform .9s cubic-bezier(.22,1,.36,1); transition-delay: var(--d, 0ms); }
    .reveal.in{ opacity: 1; transform: none; }
    /* ============================================================================
       7. СТЕКЛЯННЫЕ КАРТОЧКИ ВОЗМОЖНОСТЕЙ
       ============================================================================ */
    .cards{ display: grid; gap: 18px; margin-top: 42px; grid-template-columns: repeat(auto-fit, minmax(272px, 1fr)); }
    .card{
      position: relative; overflow: hidden; padding: 26px 24px 28px;
      border-radius: var(--radius); background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%);
      transition: transform .5s cubic-bezier(.22,1,.36,1), border-color .4s, box-shadow .5s;
    }
    .card::after{
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .45s;
      background: radial-gradient(420px 240px at var(--mx,50%) var(--my,0%), rgba(var(--a1),.16), transparent 70%);
    }
    .card:hover{ transform: translateY(-6px); border-color: rgba(255,255,255,.20); box-shadow: 0 26px 60px rgba(0,0,0,.45), 0 0 46px rgba(var(--a2),.10); }
    .card:hover::after{ opacity: 1; }
    .card-icon{
      width: 46px; height: 46px; display: grid; place-items: center; margin-bottom: 18px;
      border-radius: 14px; border: 1px solid rgba(255,255,255,.13);
      background: linear-gradient(135deg, rgba(var(--a1),.28), rgba(var(--a2),.22)); color: #eaf6ff;
      transition: transform .5s cubic-bezier(.22,1,.36,1), box-shadow .5s;
    }
    .card:hover .card-icon{ transform: scale(1.06); box-shadow: 0 10px 26px rgba(var(--a1),.30); }
    .card-icon svg{ width: 22px; height: 22px; }
    .card p{ margin: 0; color: var(--muted); font-size: 15.5px; line-height: 1.62; }

    /* ============================================================================
       8. ПЛАТФОРМЫ
       ============================================================================ */
    .platforms{ display: flex; flex-wrap: wrap; gap: 14px; margin-top: 38px; }
    .platform{
      flex: 1 1 200px; display: flex; align-items: center; gap: 14px;
      padding: 18px 20px; border-radius: 22px;
      background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%);
      transition: transform .45s cubic-bezier(.22,1,.36,1), border-color .4s, box-shadow .45s;
    }
    .platform:hover{ transform: translateY(-4px); border-color: rgba(var(--a2),.40); box-shadow: 0 20px 44px rgba(0,0,0,.4); }
    .platform svg{ width: 26px; height: 26px; flex: none; color: var(--text); }
    .platform .p-name{ display: block; font-weight: 600; font-size: 16px; }
    .platform .p-tag{ display: block; font-size: 13px; color: var(--muted); }
    a.platform{ text-decoration: none; color: inherit; }
    .platform .p-get{
      margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 700; color: rgb(var(--a2)); white-space: nowrap;
    }
    .platform .p-get svg{ width: 16px; height: 16px; color: rgb(var(--a2)); }

    /* ============================================================================
       9. КАК ЭТО РАБОТАЕТ: 3 ШАГА + СРАВНЕНИЕ
       ============================================================================ */
    .steps{ display: flex; align-items: stretch; gap: 14px; margin-top: 42px; }
    .step{
      flex: 1 1 0; padding: 26px 24px; border-radius: var(--radius);
      background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%);
      transition: transform .55s cubic-bezier(.22,1,.36,1), border-color .45s, box-shadow .45s, opacity .45s;
      opacity: .55;
    }
    .step.active{
      opacity: 1; transform: translateY(-8px);
      border-color: rgba(var(--a2),.45);
      box-shadow: 0 26px 60px rgba(0,0,0,.45), 0 0 50px rgba(var(--a2),.16);
    }
    .step-num{
      width: 34px; height: 34px; display: grid; place-items: center; margin-bottom: 16px;
      border-radius: 50%; font-weight: 700; font-size: 15px; color: var(--text);
      background: rgba(255,255,255,.07); border: 1px solid var(--line);
    }
    .step.active .step-num{ color: #04121b; background: linear-gradient(120deg, rgb(var(--a1)), rgb(var(--a2))); border-color: transparent; }
    .step h3{ margin-bottom: 6px; }
    .step p{ margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
    .step-arrow{ display: grid; place-items: center; color: rgba(255,255,255,.28); font-size: 22px; }
    .step-arrow svg{ width: 24px; height: 24px; }

    /* Таблица сравнения */
    .compare{ margin-top: 34px; overflow: hidden; }
    .compare-head, .compare-row{ display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; align-items: center; padding: 18px 26px; }
    .compare-head{ border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 700; letter-spacing: .02em; }
    .compare-head .c-plain{ color: var(--muted); }
    .compare-head .c-tngram{ color: transparent; background: linear-gradient(100deg, var(--a1-soft), var(--a2-soft)); -webkit-background-clip: text; background-clip: text; }
    .compare-row{ border-bottom: 1px solid var(--line); font-size: 15px; }
    .compare-row:last-child{ border-bottom: 0; }
    .compare-row .c-label{ color: var(--muted); }
    .compare-row .c-plain{ color: rgba(255,140,140,.9); }
    .compare-row .c-tngram{ color: rgb(var(--a2)); font-weight: 600; }

    /* ============================================================================
       10. МОКАП ПРИЛОЖЕНИЯ (телефон + сервер)
       ============================================================================ */
    .app-demo{ display: flex; align-items: center; justify-content: center; gap: 34px; margin-top: 46px; flex-wrap: wrap; }

    /* Телефон */
    .phone{
      width: 292px; flex: none; padding: 10px; border-radius: 44px; position: relative;
      background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
      border: 1px solid var(--line); box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 60px rgba(var(--a1),.14);
    }
    .phone-screen{
      height: 560px; display: flex; flex-direction: column; overflow: hidden;
      border-radius: 36px; border: 1px solid rgba(255,255,255,.06);
      background: linear-gradient(180deg, #090d15, #05070a);
    }
    .phone-bar{ display: flex; align-items: center; gap: 10px; padding: 16px 16px 14px; border-bottom: 1px solid var(--line); }
    .phone-bar img{ width: 26px; height: 26px; border-radius: 8px; }
    .phone-bar b{ font-size: 15px; font-weight: 600; }
    .phone-bar small{ display: block; color: rgb(var(--a2)); font-size: 11.5px; font-weight: 600; }
    .chat{ flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 18px 16px; }
    .msg{
      position: relative; max-width: 82%; padding: 10px 14px; border-radius: 18px;
      font-size: 14px; line-height: 1.45; opacity: 0; transform: translateY(10px);
      transition: opacity .5s, transform .5s;
    }
    .msg.in{ opacity: 1; transform: none; }
    .msg.them{ align-self: flex-start; background: rgba(255,255,255,.07); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
    .msg.me{
      align-self: flex-end; color: #04121b; border-bottom-right-radius: 6px;
      background: linear-gradient(120deg, rgb(var(--a1)), rgb(var(--a2)));
    }
    .msg-note{
      display: block; margin-top: 6px; font-size: 11px; font-weight: 600; letter-spacing: .02em;
      color: rgb(var(--a2)); opacity: 0; transition: opacity .5s;
    }
    .msg.me.saved .msg-note{ opacity: 1; }
    .phone-input{ display: flex; align-items: center; gap: 10px; padding: 14px 16px 18px; border-top: 1px solid var(--line); }
    .phone-input span{ flex: 1; color: rgba(153,163,178,.65); font-size: 13.5px; }
    .phone-input i{ width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(120deg, rgb(var(--a1)), rgb(var(--a2))); }

    /* Панель сервера */
    .server{ width: 320px; flex: none; padding: 22px; border-radius: var(--radius);
      background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%);
      box-shadow: 0 24px 60px rgba(0,0,0,.4);
    }
    .server-head{ display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .server-head svg{ width: 20px; height: 20px; color: var(--muted); }
    .server-head b{ font-size: 15px; }
    .server-body{ min-height: 112px; display: grid; place-items: center; padding: 16px; border-radius: 18px;
      border: 1px dashed rgba(255,255,255,.14); background: rgba(0,0,0,.25); }
    .server-msg{
      width: 100%; padding: 12px 14px; border-radius: 14px; font-size: 13.5px;
      background: rgba(255,255,255,.06); border: 1px solid var(--line);
      opacity: 0; transform: translateY(8px) scale(.98); transition: opacity .5s, transform .5s, filter .5s;
    }
    .server-msg.show{ opacity: 1; transform: none; }
    .server-msg.deleted{ opacity: .32; filter: grayscale(.6); }
    .server-msg.deleted .txt{ text-decoration: line-through; }
    .server-empty{ color: rgba(153,163,178,.55); font-size: 13.5px; }
    .server-msg.show ~ .server-empty{ display: none; }
    .server-status{ display: flex; align-items: center; gap: 9px; margin-top: 16px; font-size: 13.5px; color: var(--muted); min-height: 22px; }
    .server-status .sdot{ width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--a1)); box-shadow: 0 0 12px rgba(var(--a1),.8); }
    /* ============================================================================
       11. ТЕМЫ ОФОРМЛЕНИЯ
       ============================================================================ */
    .theme-options{ display: flex; flex-wrap: wrap; gap: 14px; margin-top: 34px; }
    .theme-btn{
      display: flex; align-items: center; gap: 14px; cursor: pointer;
      padding: 16px 22px; border-radius: 20px; font: inherit; font-size: 15px; font-weight: 600;
      color: var(--text); background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
      transition: transform .4s cubic-bezier(.22,1,.36,1), border-color .35s, box-shadow .4s, opacity .35s;
    }
    .theme-btn:hover{ transform: translateY(-3px); }
    .theme-btn[aria-pressed="true"]{ border-color: rgba(var(--a2),.55); box-shadow: 0 18px 44px rgba(0,0,0,.45), 0 0 40px rgba(var(--a2),.16); }
    .swatch{ width: 34px; height: 34px; border-radius: 12px; border: 1px solid rgba(255,255,255,.16); }
    .swatch.t-dark{ background: linear-gradient(135deg, #2f7bff, #00e08f); }
    .swatch.t-green{ background: linear-gradient(135deg, #00c484, #8ad62a); }
    .swatch.t-blue{ background: linear-gradient(135deg, #3b82f6, #8b5cf6); }

    /* ============================================================================
       12. ЧЕГО МЫ НЕ СОБИРАЕМ
       ============================================================================ */
    .nocollect{ display: grid; gap: 16px; margin-top: 38px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .nc-item{
      display: flex; gap: 16px; padding: 22px; border-radius: 22px;
      background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%);
      transition: transform .45s cubic-bezier(.22,1,.36,1), border-color .4s;
    }
    .nc-item:hover{ transform: translateY(-4px); border-color: rgba(var(--a2),.35); }
    .nc-icon{ width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 12px;
      background: rgba(255,110,110,.12); border: 1px solid rgba(255,110,110,.25); color: #ff9a9a; }
    .nc-icon svg{ width: 18px; height: 18px; }
    .nc-item h3{ font-size: 17px; }
    .nc-item p{ margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.6; }

    /* ============================================================================
       13. FAQ
       ============================================================================ */
    .faq{ margin-top: 34px; }
    .faq-item{ border-radius: 20px; background: var(--glass); border: 1px solid var(--line); margin-bottom: 12px; overflow: hidden;
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%); }
    .faq-item summary{
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 20px 24px; cursor: pointer; font-size: 17px; font-weight: 600; list-style: none;
    }
    .faq-item summary::-webkit-details-marker{ display: none; }
    .faq-item summary::after{ content: "+"; font-size: 24px; font-weight: 400; color: var(--a2-soft); transition: transform .35s; }
    .faq-item[open] summary::after{ transform: rotate(45deg); }
    .faq-item[open]{ border-color: rgba(var(--a2),.3); }
    .faq-answer{ padding: 0 24px 22px; color: var(--muted); font-size: 15.5px; line-height: 1.65; }

       14. ДОРОЖНАЯ КАРТА (таймлайн)
       ============================================================================ */
    .timeline{ position: relative; margin-top: 40px; padding-left: 30px; }
    .timeline::before{ content: ""; position: absolute; left: 8px; top: 10px; bottom: 10px; width: 2px;
      background: linear-gradient(180deg, rgba(var(--a2),.7), rgba(var(--a1),.35), transparent); }
    .tl-item{ position: relative; margin-bottom: 16px; padding: 20px 24px; border-radius: 22px;
      background: var(--glass); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%);
      transition: transform .45s cubic-bezier(.22,1,.36,1), border-color .4s; }
    .tl-item:hover{ transform: translateX(4px); border-color: rgba(255,255,255,.2); }
    .tl-item::before{ content: ""; position: absolute; left: -30px; top: 28px; width: 18px; height: 18px; border-radius: 50%;
      background: var(--bg); border: 2px solid rgba(var(--a1),.7); }
    .tl-item[data-status="done"]::before{ background: rgb(var(--a2)); border-color: transparent; box-shadow: 0 0 16px rgba(var(--a2),.75); }

    /* Строки статуса (кратко о проекте) */
    .status-panel{ margin-top: 26px; padding: 6px 30px; }

    /* ============================================================================

       ============================================================================ */

    .side-card{ padding: 28px; border-radius: 28px; display: grid; gap: 14px; }

    /* ============================================================================
       16. ПОДВАЛ И ПЛАВАЮЩАЯ КНОПКА
       ============================================================================ */

    .footer-links a{ color: var(--muted); font-size: 14px; text-decoration: none; transition: color .3s; }
    .footer-links a:hover{ color: var(--a2-soft); }

    .fab{
      position: fixed; right: 22px; bottom: 22px; z-index: 60; text-decoration: none;

    }
    .fab.show{ opacity: 1; pointer-events: auto; transform: none; }

  const CROSS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  /* ---------------------------------------------------------------- логика -- */

  const $  = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));
  /* Достаём значение из объекта по пути вида "hero.slogan" */
  const get = (obj, path) => path.split('.').reduce((acc, key) => (acc == null ? acc : acc[key]), obj);

  let currentLang = 'ru';
  /* Все текстовые элементы с data-i18n="путь.в.объекте" */
  function applyStaticTexts(lang){
    $$('[data-i18n]').forEach((el) => {
      const value = get(TEXTS[lang], el.dataset.i18n);
      if (typeof value === 'string') el.textContent = value;
    });
    $$('[data-i18n-placeholder]').forEach((el) => {
      const value = get(TEXTS[lang], el.dataset.i18nPlaceholder);
      if (typeof value === 'string') el.setAttribute('placeholder', value);
    });
  }

  /* Возможности */
  function renderCards(lang){
    const items = TEXTS[lang].features.items;
    $('#cards').innerHTML = items.map((item, i) => `
      <article class="card reveal" style="--d:${i * 80}ms">
        <div class="card-icon" aria-hidden="true">${ICONS[i] || ''}</div>
        <h3>${item.title}</h3>
        <p>${item.text}</p>
      </article>`).join('');
  }

  /* Платформы */
  function renderPlatforms(lang){
    const p = TEXTS[lang].platforms;
    $('#platform-list').innerHTML = p.items.map((item, i) => {
      const name = typeof item === 'string' ? item : item.name;
      const tag  = typeof item === 'string' ? p.tag   : item.tag;
      const href = typeof item === 'string' ? ''      : (item.href || '');
      const inner = `
        ${PLATFORM_ICONS[i] || ''}
        <div>
          <span class="p-name">${name}</span>
          <span class="p-tag">${tag}</span>
        </div>
        ${href ? `<span class="p-get" aria-hidden="true">${p.download}${ARROW_ICON}</span>` : ''}`;
      return href
        ? `<a class="platform reveal" style="--d:${i * 70}ms" href="${href}" download>${inner}</a>`
        : `<div class="platform reveal" style="--d:${i * 70}ms">${inner}</div>`;
    }).join('');
  }

  /* Три шага */
  function renderSteps(lang){
    const steps = TEXTS[lang].how.steps;
    $('#steps').innerHTML = steps.map((step, i) => `
      <article class="step reveal" data-index="${i}" style="--d:${i * 90}ms">
        <div class="step-num">${i + 1}</div>
        <div class="card-icon" aria-hidden="true">${STEP_ICONS[i] || ''}</div>
        <h3>${step.title}</h3>
        <p>${step.text}</p>
      </article>
      ${i < steps.length - 1 ? `<div class="step-arrow" aria-hidden="true">${ARROW_ICON}</div>` : ''}`).join('');
  }

  /* Сравнение */
  function renderCompare(lang){
    const h = TEXTS[lang].how;
    $('#compare').innerHTML = `
      <div class="compare-head">
        <span></span>
        <span class="c-plain">${h.comparePlain}</span>
        <span class="c-tngram">${h.compareTngram}</span>
      </div>
      ${h.compare.map((row) => `
        <div class="compare-row">
          <span class="c-label">${row.label}</span>
          <span class="c-plain">${row.plain}</span>
          <span class="c-tngram">${row.tngram}</span>
        </div>`).join('')}`;
  }

  /* Чего мы не собираем */
  function renderNoCollect(lang){
    const items = TEXTS[lang].nocollect.items;
    $('#nocollect').innerHTML = items.map((item, i) => `
      <div class="nc-item reveal" style="--d:${i * 80}ms">
        <div class="nc-icon" aria-hidden="true">${CROSS_ICON}</div>
        <div>
          <h3>${item.title}</h3>
          <p>${item.text}</p>
        </div>
      </div>`).join('');
  }

  /* FAQ */
  function renderFaq(lang){
    const items = TEXTS[lang].faq.items;
    $('#faq-list').innerHTML = items.map((item, i) => `
      <details class="faq-item reveal" style="--d:${i * 50}ms">
        <summary>${item.q}</summary>
        <div class="faq-answer">${item.a}</div>
      </details>`).join('');
  }

  /* Дорожная карта */
  function renderTimeline(lang){
    const r = TEXTS[lang].roadmap;
    $('#timeline').innerHTML = r.items.map((item, i) => `
      <div class="tl-item reveal" data-status="${item.status}" style="--d:${i * 70}ms">
        <span class="status-chip" data-status="${item.status}">${r.chips[item.status] || ''}</span>
        <h3>${item.title}</h3>
        <p>${item.text}</p>
      </div>`).join('');
  }

  /* Короткие строки статуса */
  function renderStatusRows(lang){
    $('#status-rows').innerHTML = TEXTS[lang].roadmap.rows.map((row) => `
      <div class="row">
        <span class="row-label">${row.label}</span>
        <span class="row-value${row.accent ? ' accent' : ''}">${row.value}</span>
      </div>`).join('');
  }

  /* Кнопки тем оформления */
  function renderThemes(lang){
    $('#theme-options').innerHTML = TEXTS[lang].themes.options.map((theme) => `
      <button class="theme-btn" type="button" data-theme="${theme.id}" aria-pressed="false">
        <span class="swatch t-${theme.id}" aria-hidden="true"></span>${theme.name}
      </button>`).join('');
  }
  /* ===========================================================================
     МОКАП: сообщение появляется в чате, ненадолго попадает на сервер и удаляется
     =========================================================================== */
  let demoTimers = [];
  const clearDemo = () => { demoTimers.forEach(clearTimeout); demoTimers = []; };
  const later = (ms, fn) => demoTimers.push(setTimeout(fn, ms));

  function renderDemo(lang){
    const m = TEXTS[lang].mockup;
    $('#chat').innerHTML = m.chat.map((msg) => `
      <div class="msg ${msg.from}">
        <span class="txt">${msg.text}</span>
        ${msg.from === 'me' ? `<span class="msg-note">${m.savedNote}</span>` : ''}
      </div>`).join('');

    /* Какое сообщение «отправим» на сервер — последнее исходящее */
    const sent = m.chat.filter((x) => x.from === 'me').slice(-1)[0];
    $('#server-msg .txt').textContent = sent ? sent.text : '';
    $('#server-msg').classList.remove('show', 'deleted');
    $('#server-status-text').textContent = '';
  }

  function runDemo(lang){
    clearDemo();
    const m = TEXTS[lang].mockup;
    const bubbles = $$('#chat .msg');
    const serverMsg = $('#server-msg');
    const statusText = $('#server-status-text');

    const reset = () => {
      bubbles.forEach((b) => b.classList.remove('in', 'saved'));
      serverMsg.classList.remove('show', 'deleted');
      statusText.textContent = '';
    };

    /* Если включён режим «меньше движения» — показываем финальный кадр без цикла */
    if (reduceMotion){
      bubbles.forEach((b) => b.classList.add('in'));
      serverMsg.classList.add('show', 'deleted');
      statusText.textContent = m.statuses[2];
      return;
    }

    reset();
    later(500,  () => { if (bubbles[0]) bubbles[0].classList.add('in'); });     // приходит сообщение
    later(1300, () => { if (bubbles[1]) bubbles[1].classList.add('in'); });     // отвечаем
    later(2200, () => { serverMsg.classList.add('show'); statusText.textContent = m.statuses[0]; }); // на сервере
    later(3800, () => { statusText.textContent = m.statuses[1]; });             // передано
    later(5200, () => { serverMsg.classList.add('deleted'); statusText.textContent = m.statuses[2]; }); // удалено
    later(6000, () => { if (bubbles[1]) bubbles[1].classList.add('saved'); });   // осталось только у тебя
    later(8800, reset);                                                        // сброс
    later(9200, () => runDemo(lang));                                          // и снова по кругу
  }
  /* ===========================================================================
     ТЕМЫ ОФОРМЛЕНИЯ
     =========================================================================== */
  const THEME_KEY = 'tngram-theme';

  function setTheme(id){
    document.documentElement.dataset.theme = id;
    $$('#theme-options .theme-btn').forEach((btn) => {
      btn.setAttribute('aria-pressed', String(btn.dataset.theme === id));
    });
    try { localStorage.setItem(THEME_KEY, id); } catch (e) {}
  }

  /* Клик по теме */
  $('#theme-options').addEventListener('click', (event) => {
    const btn = event.target.closest('button[data-theme]');
    if (btn) setTheme(btn.dataset.theme);
  });

  /* ===========================================================================
     ПОЯВЛЕНИЕ ПРИ СКРОЛЛЕ + ПОДСВЕТКА ШАГОВ ПО ОЧЕРЕДИ
     =========================================================================== */
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const observer = ('IntersectionObserver' in window && !reduceMotion)
    ? new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting){
            entry.target.classList.add('in');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' })
    : null;

  function observeReveals(){
    if (!observer){
      $$('.reveal').forEach((el) => el.classList.add('in'));
      return;
    }
    $$('.reveal:not(.in)').forEach((el) => observer.observe(el));
  }

  /* Шаг «загорается» по мере прокрутки секции: 1 → 2 → 3 */
  function updateSteps(){
    const steps = $$('#steps .step');
    if (!steps.length) return;
    const box = $('#steps').getBoundingClientRect();
    const start = window.innerHeight * 0.85;          /* когда секция входит снизу */
    const total = box.height + window.innerHeight * 0.45;
    const progress = Math.min(1, Math.max(0, (start - box.top) / total));
    let active = Math.min(steps.length - 1, Math.floor(progress * steps.length));
    if (progress <= 0) active = 0;
    steps.forEach((step, i) => step.classList.toggle('active', i <= active));
  }

  /* Не чаще одного кадра в секунду-кадра: считаем по requestAnimationFrame */
  let scrollQueued = false;
  function onScroll(){
    if (scrollQueued) return;
    scrollQueued = true;
    requestAnimationFrame(() => { scrollQueued = false; updateSteps(); updateFab(); });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  /* ===========================================================================
     ЯЗЫК
     =========================================================================== */
  function renderAll(lang){
    applyStaticTexts(lang);
    renderCards(lang);
    renderPlatforms(lang);
    renderSteps(lang);
    renderCompare(lang);
    renderNoCollect(lang);
    renderFaq(lang);
    renderTimeline(lang);
    renderStatusRows(lang);
    renderThemes(lang);
    renderDemo(lang);
    runDemo(lang);
    observeReveals();
    updateSteps();
    setTheme(document.documentElement.dataset.theme || 'dark');
  }

  function setLang(lang){
    currentLang = TEXTS[lang] ? lang : 'ru';
    const t = TEXTS[currentLang];

    document.documentElement.lang = currentLang;
    document.title = t.meta.title;
    const setMeta = (sel, value) => { const el = $(sel); if (el) el.setAttribute('content', value); };
    setMeta('#og-title', t.meta.title);
    setMeta('#og-desc', t.meta.description);
    setMeta('meta[name="description"]', t.meta.description);

    $$('#lang-switch button').forEach((btn) => {
      btn.setAttribute('aria-pressed', String(btn.dataset.lang === currentLang));
    });

    renderAll(currentLang);
    try { localStorage.setItem('tngram-lang', currentLang); } catch (e) {}
  }

  $('#lang-switch').addEventListener('click', (event) => {
    const btn = event.target.closest('button[data-lang]');
    if (btn) setLang(btn.dataset.lang);
  });

  /* ===========================================================================
     ПОДПИСКА
     =========================================================================== */
  function submitSubscribe(event){
    event.preventDefault();
    const s = TEXTS[currentLang].subscribe;
    const input = $('#email');
    const status = $('#form-status');
    const value = (input.value || '').trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value);

    if (!valid){
      status.textContent = s.error;
      status.className = 'form-status err';
      return;
    }

    /* Если подключён сервис форм — отправляем туда */
    if (CONFIG.subscribeEndpoint){
      status.textContent = '…';
      status.className = 'form-status';
      fetch(CONFIG.subscribeEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ email: value })
      })
        .then((res) => {
          if (!res.ok) throw new Error('bad');
          status.textContent = s.success;
          status.className = 'form-status ok';
          input.value = '';
        })
        .catch(() => {
          status.textContent = s.error;
          status.className = 'form-status err';
        });
      return;
    }

    /* Пока сервиса нет — открываем почтовый клиент с готовым письмом */
    const subject = encodeURIComponent(s.mailtoSubject);
    const body = encodeURIComponent(s.mailtoBody + value);
    window.location.href = 'mailto:' + CONFIG.contactEmail + '?subject=' + subject + '&body=' + body;
    status.textContent = s.success;
    status.className = 'form-status ok';
  }
  $('#subscribe-form').addEventListener('submit', submitSubscribe);

  /* Счётчик «Нас уже N» — только если число задано в CONFIG */
  function renderCounter(){
    const box = $('#counter');
    if (typeof CONFIG.subscribersCount === 'number'){
      box.textContent = TEXTS[currentLang].subscribe.counter.replace('%n', CONFIG.subscribersCount);
      box.hidden = false;
    } else {
      box.hidden = true;
    }
  }

  /* Ссылки на Telegram / GitHub: пустая ссылка = кнопка скрыта */
  function applyLinks(){
    const pairs = [
      ['#link-telegram', '#foot-telegram', CONFIG.links.telegram],
      ['#link-github',   '#foot-github',   CONFIG.links.github]
    ];
    let visible = 0;
    pairs.forEach(([mainSel, footSel, url]) => {
      [mainSel, footSel].forEach((sel) => {
        const el = $(sel);
        if (!el) return;
        if (url){ el.setAttribute('href', url); el.hidden = false; } else { el.hidden = true; }
      });
      if (url) visible++;
    });
    $('#links-hint').hidden = visible > 0;
  }

  /* ===========================================================================
     МЕЛОЧИ: плавающая кнопка, год, своя иконка, свечение под курсором
     =========================================================================== */
  function updateFab(){
    $('#fab').classList.toggle('show', window.scrollY > 600);
  }

  $('#year').textContent = new Date().getFullYear();

  /* Мягкое свечение под курсором на карточках */
  document.addEventListener('pointermove', (event) => {
    const card = event.target.closest && event.target.closest('.card');
    if (!card) return;
    const r = card.getBoundingClientRect();
    card.style.setProperty('--mx', ((event.clientX - r.left) / r.width) * 100 + '%');
    card.style.setProperty('--my', ((event.clientY - r.top) / r.height) * 100 + '%');
  });

  /* ------------------------------------------------------------------ старт -- */
  (function init(){
    /* Язык: сохранённый или русский по умолчанию */
    let startLang = 'ru';
    let startTheme = 'dark';
    try {
      const lang = localStorage.getItem('tngram-lang');
      if (lang === 'ru' || lang === 'en') startLang = lang;
      const theme = localStorage.getItem(THEME_KEY);
      if (theme) startTheme = theme;
    } catch (e) {}

    document.documentElement.dataset.theme = startTheme;
    applyLinks();
    setLang(startLang);
    renderCounter();
    updateFab();
  })();

  </script>
  <script src="web_app.js"></script>
</body>
</html>
